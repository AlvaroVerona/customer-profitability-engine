seed: 42

data:
  n_customers: 20000
  n_months: 36
  window_start_date: "2023-01-01"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  features_dir: "data/features"
  missing_rate: 0.01
  duplicate_rate: 0.003

models:
  test_months: 6
  validation_months: 3

clv:
  horizon_months: 36
  annual_discount_rate: 0.08

simulation:
  n_simulations: 10000

optimization:
  default_budget: 100000
  default_capacity: 5000

ftp:
  base_ftp_rate_annual: 0.045
  market_rate_annual: 0.035

risk:
  cost_per_support_contact: 8.0
  cac_by_channel:
    organic: 15.0
    paid_search: 65.0
    referral: 25.0
    partnership: 45.0
    advertising: 80.0

revenue:
  interchange_rate: 0.007
  premium_monthly_fee: 12.0
  low_balance_fee: 4.0
  low_balance_threshold: 300.0

operating:
  account_servicing_cost_monthly: 0.8

actions:
  retention_incentive_cost: 20.0
  savings_cross_sell_cost: 5.0
  credit_product_cost: 15.0
  investment_product_cost: 10.0
  premium_subscription_cost: 8.0
  credit_product_min_income: 12000.0

# Phase 10 per-action simulation parameters. There is no historical offer/
# acceptance data in this project's synthetic dataset (Phase 1 never
# generated such events), so acceptance_base and the effect sizes below are
# documented assumptions -- transparent heuristics, not fitted models -- see
# actions/simulator.py's module docstring.
action_simulation:
  retention_incentive:
    acceptance_base: 0.25
    acceptance_churn_sensitivity: 5.0
    churn_reduction_pct: 0.35
  savings_cross_sell:
    acceptance_base: 0.40
    balance_uplift_pct: 0.15
    assumed_savings_rate_annual: 0.02
    churn_reduction_pct: 0.10
  credit_product:
    acceptance_base: 0.30
    credit_limit_income_multiple: 0.25
    expected_utilization: 0.50
    interest_rate_annual: 0.15
    expected_pd_monthly: 0.01
    expected_lgd: 0.45
    churn_reduction_pct: 0.10
  investment_product:
    acceptance_base: 0.20
    monthly_fee_revenue: 6.0
    churn_reduction_pct: 0.10
  premium_subscription:
    acceptance_base: 0.25
    churn_reduction_pct: 0.15
