name: Full pipeline

# Runs the whole pipeline (data generation -> ... -> final report) and then the complete test
# suite with nothing skipped. Slow, so manual + weekly instead of every push.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: make all
