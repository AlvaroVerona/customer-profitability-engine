name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app
      # Tests that need the full pipeline output skip themselves on a fresh checkout; the
      # dashboard tests run against the committed demo_data/ sample.
      - name: Test
        run: python -m pytest -q -rs
