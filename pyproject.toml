[project]
name = "customer-profitability-engine"
version = "0.1.0"
description = "Customer Profitability & Action Optimization Engine for a synthetic neobank"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "ortools>=9.10",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "streamlit>=1.36",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_profitability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
